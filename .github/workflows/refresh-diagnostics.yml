name: Refresh Korea event diagnostics

on:
  schedule:
    - cron: '37 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-diagnostics.yml'
      - 'qsignals/**'
      - 'tests/**'
      - 'data/events/**'
      - 'data/calendar/**'
  pull_request:
    paths:
      - '.github/workflows/refresh-diagnostics.yml'
      - 'qsignals/**'
      - 'tests/**'
      - 'data/**'

permissions:
  contents: read

concurrency:
  # Shared with daily-refresh.yml: both write data/input, so never run them at once.
  group: korea-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s tests -t .
      - run: python3 -m qsignals.diagnose --out-dir /tmp/qsignals-report

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Import pinned upstream exports and public prices
        run: python3 -m qsignals.import_scores
      - name: Validate and regenerate diagnostics
        run: |
          python3 -m unittest discover -s tests -t .
          python3 -m qsignals.diagnose
      - name: Rebuild the dashboard exports from the same inputs
        run: |
          python3 -m qsignals.export_frontend
          python3 -m market_engine.scenarios.build_korea_library
      - name: Commit validated data and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/input reports/event_diagnostics.csv reports/event_diagnostics.md frontend/public/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh Korea event diagnostics'
          bash scripts/push_data_commit.sh
