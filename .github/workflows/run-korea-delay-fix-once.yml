name: Run Korea delay fix collection once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-korea-delay-fix-once.yml']
permissions:
  contents: read
  actions: write
jobs:
  start:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Start the existing verified score collector on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run daily-refresh.yml --ref main
