name: Refresh verified Korea portfolio data

on:
  schedule:
    # 11:47 and 23:47 KST, plus a 14:47 KST retry of the morning run (a dropped schedule or a
    # provider outage keeps the published snapshot; see qsignals.deferral).
    - cron: '47 2,5,14 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-korea-portfolio.yml'
      - 'qsignals/portfolio_korea_refresh.py'
      - 'qsignals/portfolio_import.py'
      - 'scripts/build_korea_portfolio.py'
      - 'tests/test_portfolio_korea_refresh.py'
      - 'requirements.portfolio-refresh.txt'

permissions:
  contents: read

concurrency:
  group: korea-portfolio-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      V1_DATA: /home/runner/.cache/qsignals/v1-data
      # Optional repository variable (YYYY-MM-DD): the KRX key's expiry shown on openapi.krx.co.kr.
      # KRX keys last one year and are extended only on request before they lapse.
      KRX_API_KEY_EXPIRES: ${{ vars.KRX_API_KEY_EXPIRES }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.portfolio-refresh.txt
      - name: Check required collection secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in KRX_API_KEY ECOS_API_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required repository secret is missing: $key"
              exit 1
            fi
          done
      - name: Verify code before collecting
        run: python3 -m unittest discover -s tests -t .
      - name: Restore verified V1 raw-history cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.V1_DATA }}
          key: korea-raw-${{ github.run_id }}
          restore-keys: korea-raw-
      - name: Prepare isolated collection dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/korea-portfolio-collector"
          "$RUNNER_TEMP/korea-portfolio-collector/bin/pip" install -q -r requirements.portfolio-refresh.txt
      - name: Collect and validate Korean prices and risk factors
        run: |
          "$RUNNER_TEMP/korea-portfolio-collector/bin/python" -m qsignals.portfolio_korea_refresh \
            --vkospi-cache "$V1_DATA/raw/korea/vkospi.csv" --alert-file "$RUNNER_TEMP/provider-alerts.txt"
      - name: Verify published snapshot and portfolio behavior
        run: |
          python3 -m qsignals.portfolio_korea_refresh --validate-only
          python3 -m unittest discover -s tests -t .
      - name: Commit only verified Korea portfolio inputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/portfolio-kr
          if git diff --cached --quiet; then echo 'No data changes'; exit 0; fi
          last=$(python3 -c 'from qsignals.portfolio_data import load_dataset; print(load_dataset("data/portfolio-kr").meta["as_of"])')
          git commit -m "data: refresh verified Korea portfolio ($last)"
          bash scripts/push_data_commit.sh
      - name: Fail after publishing when a provider key needs attention
        # A refused KRX key keeps prices publishing (VKOSPI may lag up to three sessions), but the
        # run must still fail so someone renews the key before the factor lag blocks publication.
        run: |
          if [ -n "${KRX_API_KEY_EXPIRES:-}" ]; then
            left=$(( ( $(date -ud "$KRX_API_KEY_EXPIRES" +%s) - $(date -u +%s) ) / 86400 ))
            if [ "$left" -le 14 ]; then
              echo "KRX_API_KEY expires on $KRX_API_KEY_EXPIRES ($left days left). Extend it on openapi.krx.co.kr (마이페이지), then update the variable KRX_API_KEY_EXPIRES." >> "$RUNNER_TEMP/provider-alerts.txt"
            fi
          fi
          if [ -s "$RUNNER_TEMP/provider-alerts.txt" ]; then
            while IFS= read -r line; do echo "::error title=Provider key needs attention::$line"; done < "$RUNNER_TEMP/provider-alerts.txt"
            exit 1
          fi
