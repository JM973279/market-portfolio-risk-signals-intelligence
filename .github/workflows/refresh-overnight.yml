name: Refresh overnight US prices

# Collects EWY and ^SOX closes for the pre-registered overnight overlay check.
# Writes only data/input/overnight_*; reports/signal_checks.md is regenerated by
# the Korea diagnostics workflow, so the two data writers never share a path.

on:
  schedule:
    - cron: '47 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-overnight.yml'
      - 'qsignals/overnight*.py'
      - 'tests/test_signal_checks.py'
      - 'requirements.portfolio-refresh.txt'
  pull_request:
    paths:
      - '.github/workflows/refresh-overnight.yml'
      - 'qsignals/overnight*.py'
      - 'tests/test_signal_checks.py'
      - 'data/input/overnight_*'

permissions:
  contents: read

concurrency:
  group: overnight-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s tests -t .

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Prepare isolated collection dependencies
        run: |
          python3 -m venv /tmp/overnight-collector
          /tmp/overnight-collector/bin/pip install -r requirements.portfolio-refresh.txt
      - name: Collect and validate EWY and ^SOX closes
        run: /tmp/overnight-collector/bin/python -m qsignals.overnight_refresh
      - name: Check stored data and the report builder
        run: |
          python3 -m unittest discover -s tests -t .
          python3 -m qsignals.signal_checks --out /tmp/signal_checks.md
      - name: Commit only validated overnight prices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/input/overnight_us.csv data/input/overnight_provenance.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh overnight US prices'
          bash scripts/push_data_commit.sh
