name: Validate and refresh portfolio analysis

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-portfolio.yml'
      - 'qsignals/portfolio*.py'
      - 'qsignals/portfolio_web/**'
      - 'tests/test_portfolio.py'
  pull_request:
    paths:
      - '.github/workflows/refresh-portfolio.yml'
      - 'qsignals/portfolio*.py'
      - 'qsignals/portfolio_web/**'
      - 'data/portfolio/**'
      - 'tests/test_portfolio.py'

permissions:
  contents: read

concurrency:
  group: portfolio-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s tests -t .
      - run: node --check qsignals/portfolio_web/app.js
  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Import portfolio snapshot at one upstream commit
        run: python3 -m qsignals.portfolio_import
      - name: Check imported data and existing diagnostics
        run: python3 -m unittest discover -s tests -t .
      - name: Commit only validated portfolio data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/portfolio
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh verified portfolio snapshot'
          git push origin HEAD:main
